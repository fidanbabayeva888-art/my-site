<input type="number" id="balInput" placeholder="Balınızı yazın">

<button onclick="hesabla()">Tövsiyə Al</button>

<p id="netice"></p>

<script>
function hesabla() {
    // Burada 'balInput' HTML-dəki id ilə eyni olmalıdır
    var bal = document.getElementById("balInput").value; 
    var mesaj = "";

    if (bal >= 600) { mesaj = "Yüksək nəticə! Tibb və ya İT seçə bilərsiniz."; }
    else if (bal >= 400) { mesaj = "Yaxşı nəticə! İqtisadiyyat uyğundur."; }
    else { mesaj = "Digər ixtisaslara baxmağınız məsləhətdir."; }

    document.getElementById("netice").innerText = mesaj;
}
</script>
