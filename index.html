<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyrun Olsun 🌸💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff7eb9;
            text-shadow: 0 0 15px rgba(255, 126, 185, 0.5);
            margin: 20px 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 50px;
            width: 100%;
            padding: 20px;
        }

        .flower {
            width: 400px;
            max-width: 90%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .love-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .bar-title {
            color: #ff3399;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .bar-outer {
            width: 70px;
            height: 250px;
            border: 3px solid #ff7eb9;
            border-radius: 50px;
            position: relative;
            background: rgba(255, 126, 185, 0.1);
            overflow: hidden;
        }

        .bar-inner {
            width: 100%;
            height: 0%; /* Başlanğıcda tam boş */
            background: linear-gradient(to top, #ff0066, #ff7eb9);
            position: absolute;
            bottom: 0;
            box-shadow: 0 0 20px #ff3399;
            transition: height 2s ease-in-out; /* Doldurma sürəti: 2 saniyəyə yavaş-yavaş dolacaq */
        }

        .percent-text {
            margin-top: 10px;
            font-weight: bold;
            color: #ff7eb9;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <h1>Xoş Gəlmisiniz!</h1>

    <div class="container">
        <img class="flower" src="https://cdn.dribbble.com/userupload/26856757/file/original-1e6f11127a31f28cd4880148ed938e68.gif" alt="Gül">

        <div class="love-section" onclick="fillLove()">
            <div class="bar-title">Sevgi Barı</div>
            <div class="bar-outer">
                <div id="loveBar" class="bar-inner"></div>
            </div>
            <div class="percent-text"><span id="percent">0</span>%</div>
            <p style="font-size: 0.8rem; color: #666;">(Doldurmaq üçün bir dəfə kliklə!)</p>
        </div>
    </div>

    <script>
        function fillLove() {
            const bar = document.getElementById('loveBar');
            const percentText = document.getElementById('percent');
            
            // Barı 100% et
            bar.style.height = '100%';
            
            // Rəqəmi də animasiya ilə artır
            let count = 0;
            const interval = setInterval(() => {
                count++;
                percentText.innerText = count;
                if (count >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        alert("Sevgi Barı Tam Doldu! ❤️🌸");
                    }, 500);
                }
            }, 20); // Rəqəmin artma sürəti
        }
    </script>

</body>
</html>
