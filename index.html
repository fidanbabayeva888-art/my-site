<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qəbul Rəhbəri</title>
    <style>
        body {
            background-color: #0a0e1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #111827;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
            border: 1px solid #1f2937;
        }
        h2 { font-size: 1.2rem; margin-bottom: 20px; color: #e5e7eb; }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid #374151;
            background-color: #1f2937;
            color: white;
            font-size: 1rem;
        }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(to right, #1e40af, #3b82f6);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { opacity: 0.9; }
        #netice {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            color: #fbbf24;
            font-weight: 500;
            min-height: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>✨ Bal Məlumatlarını Daxil Edin</h2>
        <input type="number" id="balInput" placeholder="Məsələn: 560">
        <button onclick="hesabla()">İxtisas Tövsiyəsi Al</button>
        <div id="netice"></div>
    </div>

    <script>
        function hesabla() {
            var bal = document.getElementById("balInput").value;
            var neticeSahesi = document.getElementById("netice");
            
            if (bal === "") {
                neticeSahesi.innerHTML = "Zəhmət olmasa bal daxil edin!";
                return;
            }

            var mesaj = "";
            if (bal >= 600) {
                mesaj = "Əla nəticə! Tibb, Hüquq və ya İT sahələrində ən nüfuzlu universitetləri seçə bilərsiniz.";
            } else if (bal >= 400) {
                mesaj = "Yaxşı nəticədir! İqtisadiyyat, Mühəndislik və ya Müəllimlik ixtisasları sizə uyğundur.";
            } else if (bal >= 200) {
                mesaj = "Dövlət və özəl universitetlərdə bir çox ixtisasa şansınız var.";
            } else {
                mesaj = "Balınız azdır, lakin kollecləri və ya ödənişli ixtisasları yoxlaya bilərsiniz.";
            }

            neticeSahesi.innerHTML = mesaj;
        }
    </script>

</body>
</html>
