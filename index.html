<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qəbul Rəhbəri - Universitet Tövsiyəsi</title>
    <style>
        body { background-color: #0a0e1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #111827; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; width: 380px; border: 1px solid #1f2937; }
        h2 { font-size: 1.3rem; margin-bottom: 20px; color: #60a5fa; }
        input { width: 90%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #374151; background-color: #1f2937; color: white; font-size: 1rem; outline: none; }
        button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: linear-gradient(to right, #2563eb, #7c3aed); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { transform: scale(1.02); opacity: 0.9; }
        #netice { margin-top: 25px; padding: 15px; border-radius: 12px; background: #1e293b; color: #fbbf24; font-size: 0.95rem; line-height: 1.6; display: none; border-left: 4px solid #fbbf24; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎓 Universitet və İxtisas Seçimi</h2>
        <input type="number" id="balInput" placeholder="Balınızı daxil edin (məs: 560)">
        <button onclick="tovsiyeVer()">Tövsiyə Al ✨</button>
        <div id="netice"></div>
    </div>

    <script>
        function tovsiyeVer() {
            var bal = document.getElementById("balInput").value;
            var neticeSahesi = document.getElementById("netice");
            
            if (bal === "" || bal < 0 || bal > 700) {
                alert("Zəhmət olmasa 0-700 arası düzgün bal daxil edin!");
                return;
            }

            var mesaj = "";
            neticeSahesi.style.display = "block";

            if (bal >= 650) {
                mesaj = "<strong>Mükəmməl!</strong><br>📍 <strong>Universitet:</strong> BANM, ADA və ya ATU<br>📚 <strong>İxtisas:</strong> İnformasiya Təhlükəsizliyi, Tibb və ya Hüquq.";
            } else if (bal >= 550) {
                mesaj = "<strong>Yüksək Nəticə!</strong><br>📍 <strong>Universitet:</strong> UNEC, BDU və ya BMU<br>📚 <strong>İxtisas:</strong> Maliyyə, Mühasibat, Kompüter Mühəndisliyi.";
            } else if (bal >= 400) {
                mesaj = "<strong>Yaxşı Nəticə!</strong><br>📍 <strong>Universitet:</strong> ADNSU, ADPU və ya AzTU<br>📚 <strong>İxtisas:</strong> Energetika, Müəllimlik, Logistika.";
            } else if (bal >= 250) {
                mesaj = "<strong>Orta Nəticə!</strong><br>📍 <strong>Universitet:</strong> SDU, AMU və ya Özəl Universitetlər<br>📚 <strong>İxtisas:</strong> Marketinq, Menecment, Regionşünaslıq.";
            } else {
                mesaj = "<strong>Daha çox çalışmaq olar!</strong><br>📍 Hazırda Kolleclər və ya bəzi ödənişli ixtisaslar daha uyğun görünür.";
            }

            neticeSahesi.innerHTML = mesaj;
        }
    </script>

</body>
</html>
