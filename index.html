<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyrun Olsun 🌸💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none; /* Yazıların seçilməməsi üçün */
        }

        h1 {
            font-size: 2.5rem;
            color: #ff7eb9;
            text-shadow: 0 0 15px rgba(255, 126, 185, 0.5);
            margin: 20px 0;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 50px;
            width: 100%;
            padding: 20px;
        }

        .flower {
            width: 400px;
            max-width: 90%;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .love-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer; /* Üstünə gələndə kliklənə biləcəyini göstərir */
        }

        .bar-title {
            color: #ff3399;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .bar-outer {
            width: 70px;
            height: 250px;
            border: 3px solid #ff7eb9;
            border-radius: 50px;
            position: relative;
            background: rgba(255, 126, 185, 0.1);
            overflow: hidden;
            transition: transform 0.1s;
        }

        .bar-outer:active {
            transform: scale(0.95); /* Klikləyəndə kiçik sıxılma effekti */
        }

        .bar-inner {
            width: 100%;
            height: 10%; /* Başlanğıc doluluq */
            background: linear-gradient(to top, #ff0066, #ff7eb9);
            position: absolute;
            bottom: 0;
            box-shadow: 0 0 20px #ff3399;
            transition: height 0.3s ease-out; /* Artanda yumşaq keçid */
        }

        .percent-text {
            margin-top: 10px;
            font-weight: bold;
            color: #ff7eb9;
        }
    </style>
</head>
<body>

    <h1>Xoş Gəlmisiniz!</h1>

    <div class="container">
        <img class="flower" src="https://cdn.dribbble.com/userupload/26856757/file/original-1e6f11127a31f28cd4880148ed938e68.gif" alt="Gül">

        <div class="love-section" onclick="increaseLove()">
            <div class="bar-title">Sevgi Barı</div>
            <div class="bar-outer">
                <div id="loveBar" class="bar-inner"></div>
            </div>
            <div class="percent-text">Dolur: <span id="percent">10</span>%</div>
            <p style="font-size: 0.8rem; color: #666;">(Artırmaq üçün kliklə!)</p>
        </div>
    </div>

    <script>
        let currentHeight = 10;
        
        function increaseLove() {
            if (currentHeight < 100) {
                currentHeight += 10; // Hər klikdə 10% artır
                if (currentHeight > 100) currentHeight = 100;
                
                document.getElementById('loveBar').style.height = currentHeight + '%';
                document.getElementById('percent').innerText = currentHeight;
                
                if (currentHeight === 100) {
                    alert("Sevgi Barı Tam Doldu! ❤️🌸");
                }
            }
        }
    </script>

</body>
</html>
