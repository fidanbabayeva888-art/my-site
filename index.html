<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyrun Olsun 🌸💖</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14; /* Tünd gecə rəngi */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            color: #ff7eb9; /* Parlaq çəhrayı */
            text-shadow: 0 0 15px rgba(255, 126, 185, 0.6);
            margin: 0;
        }

        /* Bu hissə sol və sağ tərəfi yan-yana düzür */
        .main-content {
            display: flex;
            flex-direction: row; /* Yan-yana düzmək üçün */
            align-items: center;
            justify-content: center;
            gap: 40px; /* Aralarında məsafə */
            width: 90%;
            max-width: 1100px;
            margin-bottom: 50px;
        }

        /* SOL TƏRƏF (Gül) */
        .flower-container {
            width: 50%; /* Səhifənin yarısı */
            max-width: 500px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
            border: 2px solid #333;
        }

        .flower-container img {
            width: 100%;
            display: block;
        }

        /* SAĞ TƏRƏF (Sevgi Barı) */
        .love-bar-container {
            width: 30%; /* Bir az daha dar */
            max-width: 250px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border-radius: 15px;
            border: 2px dashed #444; /* Müvəqqəti çərçivə */
        }

        .love-bar-title {
            color: #ff3399; /* Daha tünd parlaq çəhrayı */
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(255, 51, 153, 0.5);
            margin-bottom: 15px;
        }

        /* Animasiyalı Neon Bar */
        .bar-outline {
            width: 60px;
            height: 300px;
            border: 3px solid rgba(255, 126, 185, 0.3);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(255, 126, 185, 0.1);
        }

        .bar-fill {
            width: 100%;
            height: 70%; /* Neçə faiz dolu olduğu (burada 70%) */
            background-color: #ff3399;
            border-radius: 30px;
            position: absolute;
            bottom: 0;
            left: 0;
            box-shadow: 0 0 25px #ff3399, 0 0 50px rgba(255, 51, 153, 0.5);
            animation: fillPulse 2s infinite ease-in-out; /* Pulsasiya animasiyası */
        }

        @keyframes fillPulse {
            0% { box-shadow: 0 0 25px #ff3399; transform: scaleY(1); }
            50% { box-shadow: 0 0 35px #ff3399, 0 0 60px rgba(255, 51, 153, 0.7); transform: scaleY(1.02); }
            100% { box-shadow: 0 0 25px #ff3399; transform: scaleY(1); }
        }

        .small-text {
            color: #ccc;
            font-size: 0.9rem;
            margin-top: 15px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Xoş Gəlmisiniz!</h1>
    </div>

    <div class="main-content">
        <div class="flower-container">
            <img src="https://cdn.dribbble.com/userupload/26856757/file/original-1e6f11127a31f28cd4880148ed938e68.gif" alt="Gül Animasiyası">
        </div>

        <div class="love-bar-container">
            <div class="love-bar-title">Sevgi Barı 💞</div>
            
            <div class="bar-outline">
                <div class="bar-fill"></div>
            </div>

            <div class="small-text">Sənin üçün yaradıldı.</div>
        </div>
    </div>

</body>
</html>
