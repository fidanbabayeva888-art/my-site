<script>
    function tövsiyəVer() {
        // İstifadəçinin yazdığı balı götürürük
        let bal = document.getElementById("balInput").value;
        let nəticəSahəsi = document.getElementById("netice");

        if (bal === "") {
            alert("Zəhmət olmasa balınızı daxil edin!");
            return;
        }

        // Sadə bir məntiq qururuq
        let mesaj = "";
        if (bal >= 600) {
            mesaj = "Təbriklər! Siz Tibb və ya Hüquq kimi yüksək ixtisaslara müraciət edə bilərsiniz. ✨";
        } else if (bal >= 400) {
            mesaj = "Yaxşı nəticədir! Mühəndislik və ya İqtisadiyyat ixtisasları sizə uyğun ola bilər. 📚";
        } else if (bal >= 200) {
            mesaj = "Dövlət universitetlərində bir çox ixtisasa şansınız var. 🎓";
        } else {
            mesaj = "Balınız bir az aşağıdır, lakin kollec və ya ödənişli ixtisasları nəzərdən keçirə bilərsiniz. 💪";
        }

        // Nəticəni ekranda göstəririk
        nəticəSahəsi.innerHTML = mesaj;
        nəticəSahəsi.style.display = "block";
    }
</script>
