<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xoş Gəlmisiniz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0e14; /* Tünd gecə rəngi */
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* Səhifənin sağa-sola oynamaması üçün */
        }

        h1 {
            font-size: 2.5rem;
            color: #ff7eb9;
            text-shadow: 0 0 15px rgba(255, 126, 185, 0.4);
            margin-bottom: 20px;
        }

        .flower-container {
            width: 90%;
            max-width: 550px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .flower-container img {
            width: 100%;
            border-radius: 20px;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Xoş Gəlmisiniz!</h1>

    <div class="flower-container">
        <img src="https://cdn.dribbble.com/userupload/26856757/file/original-1e6f11127a31f28cd4880148ed938e68.gif" alt="Gül Animasiyası">
    </div>

</body>
</html>
